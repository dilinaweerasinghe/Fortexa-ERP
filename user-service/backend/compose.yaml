
services:
  mysql:
    image: mysql:8.3.0
    container_name: usermanagment
    environment:
      MYSQL_ROOT_PASSWORD: "mysql"
      MYSQL_DATABASE: user_service_db
    ports:
      - "3310:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/mysql/data:/var/lib/mysql
